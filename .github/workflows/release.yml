name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Go tests
        run: go test -count=1 ./...
      - name: Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund
      - name: Build bundle
        shell: pwsh
        run: ./scripts/Build-Bundle.ps1 -Version "${{ github.ref_name }}"
      - name: Extract release notes
        shell: pwsh
        run: ./scripts/Release-Notes.ps1 -Version "${{ github.ref_name }}" -Out dist/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/PodcastAIStudio-*.zip
            dist/SHA256SUMS.txt
